<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>My Personal Website</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /*background*/
        body{
            display: flex;
            flex-direction:column;
            min-height: 100vh;
            background: #8ca1e5;
            color: #ffffff;
        }

        /*left side content*/
        header{
            background: #283e9e;
            color:#e0e7ff;
            text-align: center;
            padding: 25px 10px;
        }

        /*header title, my personal web*/
        header h1{
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /*header paragraph, welcome to the portal kineme*/
        header p{
            font-size: 1rem;
            font-weight: 400;
        }

         /*tabs: about, register, profile*/
        nav{
            display: flex;
            justify-content: center;
            gap: 50px;
            background:#4c2174;
            padding: 14px;
            position: sticky;
            top: 0;
            z-index: 0;
        }

        /*tabs normal color*/
        nav a{
            text-decoration: none;
            color:#9d78c9;
            font-weight: 600;
            font-size: 1rem;
        }

         /*tabs change color when u point it*/
        nav a:hover{
            color:#d9c9ff;
            text-decoration: underline;
        }

        /*main container*/
        .container{
            display: flex;
            gap: 20px;
            padding: 25px;
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /*left section bg*/
        section{
            flex: 3;
            background: #08278b;
            padding: 30px;
            border-radius: 30px;
        }

        /*welcome section title*/
        section h2{
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        /*welcome paragraph*/
        section p{
            line-height: 1.6;
            font-size: 1rem;
        }

        /*right section bg*/
        aside{
            flex: 1;
            background: #6a3072;
            padding: 20px;
            border-radius: 30px;
        }

        aside h3{
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        aside ul{
            list-style-type: disc;
            padding-left: 20px;
            line-height: 1.8;
        }

        footer{
            background: #28309e;
            color:#8ca1e5;
            text-align: center;
            padding: 15px;
            margin-top: auto;
            font-weight: 500;
        }
        
    </style>


    
    <!--contents-->
    <body>
        <header>
            <h1>My Personal Website</h1>
            <p>Welcome to my Personal Student Portal</p>
        </header>


        <nav>
            <a href="HomeUPDATE.html">Home</a>
            <a href="Registration.html">Registration</a>
            <a href="Grades.html">Grades</a>
            <a href="Profile.html">Profile</a>
        </nav>

        <div class="container">
            <section>
                <h2>Welcome!</h2>
                <p>This website demonstrates Semantic HTML kinemerot</p>
            </section>

            <aside>
                <h3>Announcements</h3>
                <ul>
                    <li>Laboratory Activity 2</li>
                    <li>Apply external CSS</li>
                    <li>Use Flexbox</li>
                    <li>Sticky Navigation</li>
                </ul>
            </aside>
        </div>

        <footer>
            <p>© 2026 My Personal Website</p>
        </footer>
    </body>
       
</html>
