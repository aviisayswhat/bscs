<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!--css-->
<style>
    body{
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        text-align: center;
        margin-top: 45px;
        background-color: rgb(234, 181, 255);
    }
    .card{
        background-color: rgb(145, 199, 250);
        margin: auto;
        border: solid 2px beige;
        border-radius: 25px;
        padding: 25px;
    }
    button{
        padding: 15px 20px;
        background-color:rgb(78, 137, 226) ;
        border-radius: 25px;
        border: none;
    }
</style>

<!--html-->
<body>
    
    <div class="card">
        <h1 id="title">Hello!</h1>

        <div align="left" >

        <p>Name: Avisha Mae Chavas</p>
        <p id="course">Course: BSIT</p>
        <p>Year Level: 3rd Year</p>
</div>

        <button id="btn">Change Title</button>

        <br><br>

        <div align="left">

        <br><br>

                <th>No.</th>

                <th>Year Level</th>
            </tr>

             <tr>
                <td>1</td>

                <td>3rd Year</td>
            </tr>

            <tr>
                <td>2</td>

            </tr>

            
        </table>
    </div>

        <button class="btn3">Apply Odd Rows</button>
        <button class="btn4">Apply Even Rows</button>
    </div>
    <script src="activity6.js"></script>

</html>
